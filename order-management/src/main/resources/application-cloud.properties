# Produktivbetrieb: Backend auf Render, Datenbank auf Neon (PostgreSQL mit pgvector)

# Server Configuration (Render setzt PORT)
server.port=${PORT:8080}

# Database Configuration (Neon, JDBC-Adresse mit sslmode=require)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kleiner Pool für den Free-Plan. Das Backend wird per Ping wach gehalten (.github/workflows/keep-alive.yml),
# die Datenbank soll trotzdem einschlafen können: Neon legt sie nach 5 Minuten ohne Abfrage schlafen.
# Deshalb hält der Pool keine Verbindung dauerhaft offen und schickt keine Keepalive-Abfragen
# (HikariCP würde sonst alle 2 Minuten eine senden). Verbindungen werden nach 2 Minuten ohne Nutzung
# geschlossen, also bevor Neon sie beim Einschlafen kappt.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=0
# Das Aufwachen der Datenbank dauert einen Moment, daher etwas mehr Zeit für den Verbindungsaufbau.
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration
logging.level.com.thomas.order_management=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Actuator für den Health-Check von Render und GitHub Actions
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Ohne Datenbankabfrage: Render und der Keep-alive-Ping rufen den Health-Check laufend auf und würden
# die Datenbank sonst rund um die Uhr wach halten (Neon Free: 100 CU-Stunden pro Monat).
management.health.db.enabled=false

# CORS for Frontend (Netlify-Produktion und Deploy-Previews)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://order-management-front.netlify.app,https://*--order-management-front.netlify.app}

# Application Info
spring.application.name=Order Management System
info.app.name=Order Management
info.app.description=Enterprise Order Management System
info.app.version=1.0.0
