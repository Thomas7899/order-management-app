# ===== ORDER MANAGEMENT APPLICATION =====
spring.application.name=order-management
spring.application.version=@project.version@

server.port=8080
server.servlet.context-path=/

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Berlin

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Berlin

# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/order_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Liquibase Database Migrations =====
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ===== OpenAI / Spring AI =====
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
app.similarity.top-k=50

spring.ai.vectorstore.pgvector.enabled=true

# ===== AI Configuration (V2) =====
# Temperatur für deterministische Ausgaben (0.0-1.0, niedriger = deterministischer)
app.ai.temperature=0.3
# Maximale Tokens pro LLM-Antwort
app.ai.max-tokens=2000

# Embedding-Konfiguration
app.ai.embedding.dimensions=1536
app.ai.embedding.batch-size=20
app.ai.embedding.default-top-k=50
app.ai.embedding.max-text-length=2000
app.ai.embedding.chunk-size=500
app.ai.embedding.chunk-overlap=50

# Retry-Konfiguration für API-Aufrufe
app.ai.retry.max-attempts=3
app.ai.retry.backoff-ms=1000
app.ai.retry.backoff-multiplier=2.0

# Rate-Limiting
app.ai.rate-limit.enabled=true
app.ai.rate-limit.chat-requests-per-minute=60
app.ai.rate-limit.embedding-requests-per-minute=200

# ===== OpenAPI / Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false

# ===== Application Settings =====
app.analytics.enabled=true

app.dev.reset-on-start=true
app.dev.generate-embeddings=${APP_DEV_GENERATE_EMBEDDINGS:false}
