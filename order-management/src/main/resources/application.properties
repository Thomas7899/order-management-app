# ===== ORDER MANAGEMENT APPLICATION =====
# Professional Multi-Environment Configuration
# Purpose: Demonstrate enterprise-level Spring configuration patterns

# ===== APPLICATION METADATA =====
spring.application.name=order-management
spring.application.version=@project.version@

# ===== ACTIVE PROFILE =====
# Default: development
# Override with: --spring.profiles.active=prod for production
#spring.profiles.active=dev

# ===== SERVER CONFIGURATION =====
server.port=8080
server.servlet.context-path=/

# ===== JACKSON (JSON) CONFIGURATION =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Berlin

# ===== JPA / HIBERNATE SETTINGS =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Berlin

# ===== DATABASE CONFIGURATION (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/order_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== LOGGING CONFIGURATION =====
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== ACTUATOR / MONITORING =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# =========================================================
# ===== SPRING AI / OPENAI CONFIGURATION ==================
# =========================================================

# 👉 Hier deinen API-Key eintragen:
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Optional: explizites Modell (Standard: gpt-4o-mini)
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Optional: falls eigener Proxy oder API-Endpunkt genutzt wird
# spring.ai.openai.base-url=https://api.openai.com/v1

# =========================================================
# ===== VECTOR STORE (PGVECTOR) CONFIGURATION =============
# =========================================================
spring.ai.vectorstore.pgvector.table-name=review_embeddings
spring.ai.vectorstore.pgvector.index-type=ivfflat
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# =========================================================
# ===== CUSTOM APP SETTINGS (DEMO / ANALYTICS) ============
# =========================================================
#app.analytics.review-trend.cron=0 0 3 * * *   
app.analytics.enabled=true
