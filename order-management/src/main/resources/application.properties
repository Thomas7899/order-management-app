# ===== ORDER MANAGEMENT APPLICATION =====
spring.application.name=order-management
spring.application.version=@project.version@

server.port=8080
server.servlet.context-path=/

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Berlin

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Berlin

# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/order_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Flyway Database Migrations =====
# Das Schema wird ausschließlich über db/migration verwaltet; Hibernate ändert es nicht.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Virtuelle Threads (Java 21+): blockierende Aufrufe wie die OpenAI-API belegen keine Tomcat-Threads
spring.threads.virtual.enabled=true

# ===== OpenAI / Spring AI =====
# Ohne Schlüssel startet die Anwendung trotzdem: Auswertungen laufen dann regelbasiert,
# nur die semantische Suche antwortet mit 503.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=text-embedding-3-small
# Fehlgeschlagene KI-Aufrufe nur einmal wiederholen, damit Anfragen nicht in Timeouts laufen
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms

# ===== KI-Funktionen =====
app.ai.enabled=${APP_AI_ENABLED:true}
app.ai.temperature=0.2
app.ai.max-tokens=1500
# Bewertungen nach dem Erzeugen der Demo-Daten im Hintergrund per KI klassifizieren
app.ai.classify-on-start=${APP_AI_CLASSIFY_ON_START:true}
app.ai.classification-batch-size=20
# Semantische Suche: Treffer unterhalb dieser Kosinus-Ähnlichkeit werden verworfen
app.ai.search.min-similarity=0.42
app.ai.search.default-limit=30

# ===== OpenAPI / Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false

# ===== Application Settings =====
app.analytics.enabled=true

# Demo-Daten: werden bei leerer Datenbank erzeugt (Simulation eines Geschäftsjahres, dauert einige Minuten).
# Mit APP_DEV_RESET_ON_START=true werden alle Bewegungs- und Stammdaten bei jedem Start neu erzeugt.
app.demo.seed-data=${APP_DEMO_SEED_DATA:true}
app.demo.users-enabled=${APP_DEMO_USERS_ENABLED:true}
app.dev.reset-on-start=${APP_DEV_RESET_ON_START:false}
app.dev.generate-embeddings=${APP_DEV_GENERATE_EMBEDDINGS:false}

# ===== Security =====
# Mindestens 32 Zeichen; ohne Wert wird bei jedem Start ein zufälliger Schlüssel erzeugt.
app.security.jwt-secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://order-management-front.netlify.app,https://*--order-management-front.netlify.app}
