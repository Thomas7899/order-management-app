name: Keep-alive

# Hält das Backend auf Render wach. Die Free-Instanz schläft nach 15 Minuten ohne Anfragen ein,
# und der nächste Aufruf muss dann die ganze Anwendung neu starten.
# Der Health-Check fragt die Datenbank nicht ab (management.health.db.enabled=false im Profil "cloud"),
# die Neon-Datenbank kann also weiterhin einschlafen.

on:
  schedule:
    # Alle 5 Minuten, versetzt zur vollen Stunde. GitHub startet geplante Läufe oft verspätet,
    # deshalb deutlich häufiger als die 15 Minuten, nach denen Render die Instanz schlafen legt.
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

env:
  BACKEND_URL: https://thomas-order-backend.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Schläft die Instanz doch einmal, weckt der Aufruf sie auf; das dauert, daher mehrere Versuche
      - name: Ping
        run: |
          curl -fsS -o /dev/null --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            -w "Antwort %{http_code} nach %{time_total} s\n" "$BACKEND_URL/actuator/health"
