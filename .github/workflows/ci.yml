name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Manuell erneut deployen: Actions → CI → Run workflow (Branch main)
  workflow_dispatch:

env:
  BACKEND_URL: https://thomas-order-backend.onrender.com
  NETLIFY_SITE_ID: 61edabe6-b160-4b89-b337-f51983aa9d94

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Tests
        working-directory: order-management
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: order-management-frontend/package-lock.json

      - name: Install
        working-directory: order-management-frontend
        run: npm ci

      - name: Build
        working-directory: order-management-frontend
        run: npx ng build

      - name: Tests
        working-directory: order-management-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # Deploy nur von main und nur, wenn Backend- und Frontend-Prüfungen grün sind
  deploy-backend:
    needs: [ backend, frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ env.BACKEND_URL }}
    steps:
      # Render baut das Image aus order-management/Dockerfile; Auto-Deploy ist dort ausgeschaltet
      - name: Deploy auf Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::Secret RENDER_API_KEY fehlt"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "::error::Variable RENDER_SERVICE_ID fehlt"; exit 1; }
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"

          deploy_id=$(curl -fsS -X POST "$api" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$GITHUB_SHA\"}" | jq -r '.id')
          test -n "$deploy_id" && test "$deploy_id" != "null" || { echo "::error::Render hat keinen Deploy angelegt"; exit 1; }
          echo "Render-Deploy $deploy_id für ${GITHUB_SHA::7} gestartet"

          # Image-Build und Start dauern auf dem Free-Plan einige Minuten
          for i in $(seq 1 120); do
            status=$(curl -fsS "$api/$deploy_id" -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            case "$status" in
              live) echo "Deploy ist live"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render-Deploy endete mit Status $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render-Deploy ist nach 30 Minuten nicht live"; exit 1

      - name: Health-Check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/actuator/health" | grep -q '"UP"'; then
              echo "Backend ist erreichbar"; exit 0
            fi
            sleep 10
          done
          echo "::error::Backend antwortet nach dem Deploy nicht"; exit 1

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    environment:
      name: production-frontend
      url: https://order-management-front.netlify.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: order-management-frontend/package-lock.json

      - name: Build
        working-directory: order-management-frontend
        run: |
          npm ci
          npx ng build

      - name: Deploy nach Netlify
        working-directory: order-management-frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::Secret NETLIFY_AUTH_TOKEN fehlt"; exit 1; }
          npx --yes netlify-cli@27.12.0 deploy --prod --dir=dist/order-management-frontend/browser \
            --site "$NETLIFY_SITE_ID" --message "GitHub Actions ${GITHUB_SHA::7}"
