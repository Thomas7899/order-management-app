<!-- order-management-frontend/src/app/orders/order-form/order-form.component.html -->
<div class="add-form">
  <h3>{{ order ? 'Bestellung bearbeiten' : 'Neue Bestellung' }}</h3>
  <form (ngSubmit)="saveOrder()" #orderForm="ngForm">
    <div class="form-row">
      <div class="form-group">
        <label>Kunde *</label>
        <select [(ngModel)]="currentOrder.customerId" name="customerId" required class="form-control">
          <option value="">Kunde wählen</option>
          <option *ngFor="let c of customers" [value]="c.id">
            {{ c.firstName }} {{ c.lastName }} ({{ c.email }})
          </option>
        </select>
      </div>
      <div class="form-group">
        <label>Status *</label>
        <select [(ngModel)]="currentOrder.status" name="status" required class="form-control">
          <option value="PENDING">Ausstehend</option>
          <option value="PROCESSING">In Bearbeitung</option>
          <option value="SHIPPED">Versandt</option>
          <option value="DELIVERED">Geliefert</option>
          <option value="CANCELLED">Storniert</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Lieferadresse</label>
      <textarea [(ngModel)]="currentOrder.shippingAddress" name="shippingAddress" rows="3" class="form-control"></textarea>
    </div>

    <div class="order-items-section">
      <h4>Bestellpositionen</h4>
      <div *ngFor="let item of currentOrder.orderItems; let i = index" class="item-row">
        <select [(ngModel)]="item.productId" [name]="'productId_' + i" (change)="updateItemPrice(i)" class="form-control">
          <option value="">Produkt wählen</option>
          <option *ngFor="let p of products" [value]="p.id">{{ p.name }} ({{ p.price | currency:'EUR' }})</option>
        </select>
        <input type="number" [(ngModel)]="item.quantity" [name]="'quantity_' + i" min="1" class="form-control" />
        <input type="number" [(ngModel)]="item.price" [name]="'price_' + i" readonly class="form-control" />
        <span class="item-total">{{ item.quantity * item.price | currency:'EUR' }}</span>
        <button type="button" (click)="removeOrderItem(i)" class="btn btn-sm btn-outline-danger">✕</button>
      </div>
      <button type="button" (click)="addOrderItem()" class="btn btn-sm btn-outline-primary">Position hinzufügen</button>
    </div>

    <div class="order-total">
      <strong>Gesamtsumme: {{ getOrderTotal() | currency:'EUR' }}</strong>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="!orderForm.valid || currentOrder.orderItems.length === 0" class="btn btn-success">
        {{ order ? 'Aktualisieren' : 'Speichern' }}
      </button>
      <button type="button" (click)="cancel.emit()" class="btn btn-secondary">Abbrechen</button>
    </div>
  </form>
</div>
