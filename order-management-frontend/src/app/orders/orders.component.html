<!-- order-management-frontend/src/app/orders/orders.component.html -->
<div class="orders-container">

  <div class="header">
    <h2>Bestellungsverwaltung</h2>
    <button class="btn btn-primary" (click)="toggleForm()">
      {{ showAddForm ? 'Abbrechen' : 'Neue Bestellung' }}
    </button>
  </div>

  @if (showAddForm) {
    <app-order-form
      [order]="editingOrder"
      [customers]="customers"
      [products]="products"
      (save)="handleSave($event)"
      (cancel)="toggleForm()">
    </app-order-form>
  }

  <div class="filters-bar">
    <div class="search-group">
      <input type="text"
             [(ngModel)]="searchTerm"
             (input)="searchOrders()"
             placeholder="Bestellungen suchen..."
             class="form-control" />
    </div>

    <div class="filter-group">
      <select [(ngModel)]="statusFilter"
              (change)="filterOrders()"
              class="form-control">
        <option value="">Alle Status</option>
        <option value="PENDING">Ausstehend</option>
        <option value="PROCESSING">In Bearbeitung</option>
        <option value="SHIPPED">Versandt</option>
        <option value="DELIVERED">Geliefert</option>
        <option value="CANCELLED">Storniert</option>
      </select>
    </div>
  </div>

  <div class="orders-analytics">
    <h3>📊 Bestellungsanalyse</h3>
    <div class="chart-container">
      @if (chartOptions) {
        <echarts
          [options]="chartOptions"
          [autoResize]="true"
          class="chart"></echarts>
      }
    </div>
  </div>

  <app-order-list
    [orders]="displayedOrders"
    (edit)="handleEdit($event)"
    (delete)="handleDelete($event)"
    (view)="handleView($event)">
  </app-order-list>

  @if (selectedOrder) {
    <app-order-details-modal
      [order]="selectedOrder"
      (close)="handleCloseDetails()">
    </app-order-details-modal>
  }
</div>
