<div class="customers-analytics">
  <h3>Kundenanalyse</h3>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">👤 Gesamtkunden</div>
      <div class="kpi-value">{{ kpiTotalCustomers }}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">📈 Neue Kunden (letzte 30 Tage)</div>
      <div class="kpi-value">{{ kpiNewCustomers30d }}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">💰 Ø Umsatz pro Kunde</div>
      <div class="kpi-value">{{ kpiAvgRevenuePerCustomer | currency:'EUR' }}</div>
    </div>
  </div>

  <div class="analytics-grid">
    <div class="chart-box wide">
      <h4>Registrierungen über Zeit (pro Monat)</h4>
      <div echarts [options]="registrationsChartOptions" class="chart"></div>
    </div>

    <div class="chart-box">
      <h4>Top 10 Kunden (Bestellanzahl)</h4>
      <div echarts [options]="topCustomersChartOptions" class="chart"></div>
    </div>

    <div class="chart-box">
      <h4>Top 10 Kunden (Umsatz)</h4>
      <div echarts [options]="topRevenueChartOptions" class="chart"></div>
    </div>
  </div>
</div>
