<!-- src/app/products/components/product-form/product-form.component.html -->
<div class="product-form">

  <div class="form-group">
    <label>Name</label>
    <input [(ngModel)]="model.name" type="text" class="form-control" />
  </div>

  <div class="form-group">
    <label>Beschreibung</label>
    <textarea [(ngModel)]="model.description" class="form-control"></textarea>
  </div>

  <div class="form-group">
    <label>Preis</label>
    <input [(ngModel)]="model.price" type="number" class="form-control" />
  </div>

  <div class="form-group">
    <label>Bestand</label>
    <input [(ngModel)]="model.stockQuantity" type="number" class="form-control" />
  </div>

  <div class="form-group">
    <label>Kategorie</label>
    <select [(ngModel)]="model.category" class="form-control">
      <option [ngValue]="ProductCategory.ELEKTRONIK">Elektronik</option>
      <option [ngValue]="ProductCategory.MOEBEL">Möbel</option>
      <option [ngValue]="ProductCategory.BELEUCHTUNG">Beleuchtung</option>
      <option [ngValue]="ProductCategory.BUEROBEDARF">Bürobedarf</option>
      <option [ngValue]="ProductCategory.KLEIDUNG">Kleidung</option>
      <option [ngValue]="ProductCategory.HAUSHALT">Haushalt</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn btn-success" (click)="triggerSave()">Speichern</button>
    <button class="btn btn-secondary" (click)="cancel.emit()">Abbrechen</button>
  </div>

</div>
