<!-- src/app/products/components/product-form/product-form.component.html -->
<div class="card form-card">
  <div class="card-body">
    <h5>{{ editingProduct ? 'Produkt bearbeiten' : 'Produkt hinzufügen' }}</h5>
    <form (ngSubmit)="save.emit()">
      <div class="form-row">
        <div class="mb-3">
          <label>Name:</label>
          <input type="text" [(ngModel)]="product.name" name="name" required class="form-control">
        </div>
        <div class="mb-3">
          <label>Preis:</label>
          <input type="number" [(ngModel)]="product.price" name="price" required class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="mb-3">
          <label>Kategorie:</label>
          <select [(ngModel)]="product.category" name="category" required class="form-control">
            <option value="Elektronik">Elektronik</option>
            <option value="Möbel">Möbel</option>
            <option value="Beleuchtung">Beleuchtung</option>
            <option value="Bürobedarf">Bürobedarf</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Lagerbestand:</label>
          <input type="number" [(ngModel)]="product.stockQuantity" name="stockQuantity" required class="form-control">
        </div>
      </div>
      <div class="mb-3">
        <label>Beschreibung:</label>
        <textarea [(ngModel)]="product.description" name="description" class="form-control" rows="3"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-success">Speichern</button>
        <button type="button" (click)="cancel.emit()" class="btn btn-secondary">Abbrechen</button>
      </div>
    </form>
  </div>
</div>
